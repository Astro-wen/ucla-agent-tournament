# CI: install the project the way scripts/setup_machine.sh does, then lint for syntax errors / undefined names and
# run the full pytest suite (step 2 of "How changes get promoted" in CLAUDE.md). The long real-decision replays
# (scripts/replay_real.py), ladders and rehearsals stay local: they need minutes to hours of search time.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.lock
    - name: Set up Node 22 (the deployment bundle ships Node 22)
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          agent/js/package-lock.json
          local/js/package-lock.json
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -e ".[dev]" flake8
    - name: Install Node packages (damage calculator, Showdown simulator)
      run: |
        (cd agent/js && npm ci --no-audit --no-fund)
        (cd local/js && npm ci --no-audit --no-fund)
    - name: Link frozen copies to the shared node_modules (as scripts/setup_machine.sh does)
      run: |
        for d in champion/agent/js versions/*/agent/js local/sparring/*/agent/js; do
          [ -f "$d/calc.js" ] || continue
          up=$(echo "$d" | sed 's#[^/][^/]*#..#g')
          [ -e "$d/node_modules" ] || ln -sfn "$up/agent/js/node_modules" "$d/node_modules"
        done
        mkdir -p logs
        for n in local replay x sid; do ln -sf /dev/null "logs/$n.jsonl"; done
    - name: Lint with flake8 (syntax errors and undefined names only)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .git,node_modules
    - name: Test with pytest
      run: |
        python -m pytest -q
